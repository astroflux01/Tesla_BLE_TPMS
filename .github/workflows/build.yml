name: Build TPMS Firmware

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh

      - name: Update ESP32 Index
        run: |
          ./bin/arduino-cli config init
          ./bin/arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/releases/download/3.3.8/package_esp32_index.json
          ./bin/arduino-cli core update-index
          ./bin/arduino-cli core install esp32:esp32@3.3.8

      - name: List files
        run: ls -la

      - name: Rename sketch file
        run: mv Tesla_BLE_TPMS_v03.ino Tesla_BLE_TPMS.ino

      - name: Compile Firmware
        run: |
          ./bin/arduino-cli compile --fqbn esp32:esp32:esp32:PartitionScheme=huge_app --output-dir ./build Tesla_BLE_TPMS.ino

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tpms-firmware
          path: 'build/**/*.bin'
